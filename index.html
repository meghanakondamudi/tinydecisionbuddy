<!DOCTYPE html>
<html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tiny Decision Buddy</title>

    <meta
        name="description"
        content="A tiny companion for everyday decisions."
    >

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="css/reset.css">

    <link rel="stylesheet" href="css/variables.css">

    <link rel="stylesheet" href="css/style.css">

</head>
    
<body>

    <!-- Background -->

    <div class="background">

        <div class="background__texture"></div>

        <div class="background__leaf leaf-1"></div>
        <div class="background__leaf leaf-2"></div>
        <div class="background__leaf leaf-3"></div>

    </div>

    <!-- Main -->

    <main class="app">

        <!-- Brand -->

        <header class="hero">

            <img
                src="assets/buddy.svg"
                alt="Tiny Decision Buddy"
                class="hero__buddy"
            >

            <h1 class="hero__title">

                Tiny Decision Buddy

            </h1>

            <p class="hero__subtitle">

                A tiny companion for everyday decisions.

            </p>

        </header>

        <!-- Decision Area -->

        <section
            class="decision"
            aria-labelledby="question-label"
        >

            <label
                id="question-label"
                class="sr-only"
                for="question"
            >
                Ask your question
            </label>

            <textarea

                id="question"

                class="decision__input"

                rows="2"

                maxlength="200"

                placeholder="Should I buy that book?"

            ></textarea>

            <p class="decision__hint">

                Press Enter or click Decide

            </p>

            <button

                class="decision__button"

                id="decideButton"

                type="button"

            >

                Decide

            </button>

        </section>

        <!-- Loading -->

        <section

            id="loading"

            class="loading hidden"

            aria-live="polite"

        >

            <div class="loading__buddy">

                <img

                    src="assets/buddy.svg"

                    alt=""

                    aria-hidden="true"

                >

            </div>

            <p id="loadingText">

                Taking a moment...

            </p>

        </section>

        <!-- Result -->

        <section

            id="result"

            class="result hidden"

            aria-live="polite"

        >

            <div class="result__card">

                <span

                    id="resultCategory"

                    class="result__category"

                >

                    Go for it.

                </span>

                <h2

                    id="resultTitle"

                    class="result__title"

                >

                    Go for it.

                </h2>

                <p

                    id="resultMessage"

                    class="result__message"

                >

                    You've thought about this long enough.

                </p>

                <div class="result__actions">

                    <button

                        id="againButton"

                        class="button button--secondary"

                    >

                        Ask Again

                    </button>

                    <button

                        id="saveButton"

                        class="button button--primary"

                    >

                        Save

                    </button>

                </div>

            </div>

        </section>

    </main>

    <!-- History -->

    <aside

        id="historyPanel"

        class="history"

        aria-label="Decision history"

    >

        <div class="history__header">

            <h2>

                Your Decisions

            </h2>

            <button

                id="closeHistory"

                class="icon-button"

                aria-label="Close history"

            >

                ✕

            </button>

        </div>

        <div

            id="historyList"

            class="history__content"

        >

        </div>

    </aside>

    <!-- Floating Buttons -->

    <button

        class="floating-button floating-button--history"

        id="historyButton"

        aria-label="Open history"

    >

        History

    </button>

    <button

        class="floating-button floating-button--theme"

        id="themeButton"

        aria-label="Change appearance"

    >

        Theme

    </button>

   <script src="responses.js"></script>
   <script src="script.js"></script>

</body>
</html>

</body>

</html>
